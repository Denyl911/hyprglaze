name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: build & test (archlinux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system packages
        # Arch container is the canonical build environment (PKGBUILD path).
        # nodejs is needed by actions/checkout; git for fetching deps.
        # Protocol XMLs are vendored in protocols/; wayland-scanner comes
        # with wayland.
        run: |
          pacman -Syu --noconfirm --needed \
            wayland mesa libglvnd stb libpulse glslang \
            base-devel git nodejs

      - uses: actions/checkout@v7

      # Zig from minimum_zig_version in build.zig.zon, not whatever Arch
      # ships today, so CI builds with the version the package promises.
      - uses: mlugg/setup-zig@v2

      - name: Validate shaders
        run: |
          for f in shaders/*.frag tools/harness_probe.frag; do
            glslangValidator "$f" || exit 1
          done

      - name: Validate Shadertoy wrapper
        run: |
          for f in tools/fixtures/*.frag; do
            zig build shadertoy-wrap -- "$f" > /tmp/wrapped.frag || exit 1
            glslangValidator /tmp/wrapped.frag || exit 1
          done

      - name: zig build test
        run: zig build test

      - name: zig build (Debug)
        run: zig build

      - name: zig build (ReleaseSafe)
        # Matches the PKGBUILD optimize flag.
        run: zig build -Doptimize=ReleaseSafe
